# 1. Corrigido o ID do job para 'build-and-deploy'
  build-and-deploy:
    name: Build & Deploy Vercel Preview
    needs: [unit-tests]
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.vercel_deploy.outputs.deployment_url }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Pull Vercel Config
        run: yarn vercel pull --yes --environment=preview --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE

      - name: Build Vercel
        run: yarn vercel build --token=$VERCEL_TOKEN

      - name: Deploy Vercel
        id: vercel_deploy
        run: |
          URL=$(yarn vercel deploy --prebuilt --target=preview --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE)
          echo "deployment-url=$URL" >> $GITHUB_OUTPUT

  e2e-tests:
    name: Run E2E Tests
    needs: [build-and-deploy] # <--- Agora aponta corretamente
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Install Playwright Browsers
        run:  yarn playwright install --with-deps chromium

      - name: Run E2E Regression Tests
        run: yarn playwright test playwright/e2e
        env:
          BASE_URL: ${{ needs.build-and-deploy.outputs.deployment-url }} # <--- Agora aponta corretamente

      - name: Upload Playwright report
        if: ${{ !canceled() }}
        uses: actions/upload-artifact@v4.3.2
        with:
          name: playwright-report
          path: playwright-report