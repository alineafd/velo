# Workflow de Integração Contínua (CI)
# Objetivo:
# Executar os testes unitários da aplicação a cada push na branch main.
# Estrutura mantida simples e preparada para expansão futura com novos jobs e etapas.

name: Continuous Integration

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: '24'
  VERCEL_TOKEN: ${{secrets.VERCEL_TOKEN}}
  VERCEL_SCOPE: ${{secrets.VERCEL_SCOPE}}

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      # Realiza o checkout do código-fonte do repositório
      - name: Checkout Repository
        uses: actions/checkout@v6.0.2

      # Configura a versão do Node.js utilizada pelo projeto
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Habilita o Corepack para gerenciamento do Yarn
      - name: Enable Corepack
        run: corepack enable

      # Instala as dependências utilizando o lockfile do projeto
      - name: Install Dependencies
        run: yarn install --immutable

      # Executa os testes unitários com Vitest
      - name: Run Unit Tests
        run: yarn test
      
    
  build-end-deploy:
    name: Build & Deploy Vercel Preview
    needs: [unit-tests  ]
    runs-on: ubuntu-latest
    
    steps:
      # Realiza o checkout do código-fonte do repositório
      - name: Checkout Repository
        uses: actions/checkout@v6.0.2

      # Configura a versão do Node.js utilizada pelo projeto
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Habilita o Corepack para gerenciamento do Yarn
      - name: Enable Corepack
        run: corepack enable

      # Instala as dependências utilizando o lockfile do projeto
      - name: Install Dependencies
        run: yarn install --immutable

      # Build para o vercel
      - name: Build Vercel
        run: yarn vercel build --token=$VERCEL_TOKEN

      # Deploy preview no vercel
      - name: Deploy Vercel
        run: yarn vercel deploy --prebuild --target=preview --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE
