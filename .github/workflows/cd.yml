# Workflow de Integração Contínua (CI) e Entrega Contínua (CD)
# Objetivo: Executar testes unitários, fazer deploy de preview na Vercel, rodar testes E2E e promover para produção.
#
# ALTERAÇÃO (preview com banco isolado):
# O job "promote" deixou de usar `vercel promote`, pois esse comando apenas reaponta
# o domínio de produção para o build de preview já existente — e esse build foi gerado
# com as variáveis VITE_SUPABASE_* do ambiente Preview (apontando para o Supabase de preview).
# Como variáveis VITE_* são embutidas no bundle em tempo de build, reaproveitar o build de
# preview faria a produção continuar conversando com o banco de preview.
# A solução escolhida foi gerar um NOVO build no job de promote, agora puxando as
# variáveis do ambiente Production da Vercel, e fazer o deploy direto para produção.

name: Continuous Deployment

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: '24'
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Realiza o checkout do código-fonte do repositório
      - name: Checkout Repository
        uses: actions/checkout@v6.0.2

      # Configura a versão do Node.js utilizada pelo projeto
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Habilita o Corepack para gerenciamento do Yarn
      - name: Enable Corepack
        run: corepack enable

      # Instala as dependências utilizando o lockfile do projeto
      - name: Install Dependencies
        run: yarn install --immutable

      # Executa os testes unitários com Vitest
      - name: Run Unit Tests
        run: yarn test

  build-and-deploy:
    name: Build & Deploy Vercel Preview
    needs: [unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deployment-url: ${{ steps.vercel_deploy.outputs.deployment_url }}

    steps:
      # Realiza o checkout do código-fonte do repositório
      - name: Checkout Repository
        uses: actions/checkout@v6.0.2

      # Configura a versão do Node.js utilizada pelo projeto
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Habilita o Corepack para gerenciamento do Yarn
      - name: Enable Corepack
        run: corepack enable

      # Instala as dependências utilizando o lockfile do projeto
      - name: Install Dependencies
        run: yarn install --immutable

      # Obter as configurações do vercel para o ambiente de PREVIEW
      # As variáveis VITE_SUPABASE_* cadastradas no ambiente "Preview" da Vercel
      # devem apontar para o projeto Supabase de preview.
      - name: Pull Vercel Config
        run: yarn vercel pull --yes --environment=preview --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE

      # Build para o vercel (aqui as variáveis VITE_* de preview são embutidas no bundle)
      - name: Build Vercel
        run: yarn vercel build --token=$VERCEL_TOKEN

      # Deploy preview no vercel
      - name: Deploy Vercel
        id: vercel_deploy
        run: |
          URL=$(yarn --silent vercel deploy --prebuilt --target=preview --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE)
          echo "deployment-url=$URL" >> $GITHUB_OUTPUT

  e2e-tests:
    name: Run E2E Tests
    needs: [build-and-deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Realiza o checkout do código-fonte do repositório
      - name: Checkout Repository
        uses: actions/checkout@v6.0.2

      # Configura a versão do Node.js utilizada pelo projeto
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Habilita o Corepack para gerenciamento do Yarn
      - name: Enable Corepack
        run: corepack enable

      # Instala as dependências para gerar a pasta node_modules necessária para o Playwright
      - name: Install Dependencies
        run: yarn install --immutable

      # Descobre a versão exata do Playwright instalada, para usar na chave do cache.
      # O comando "yarn playwright --version" imprime duas linhas — a primeira é
      # o eco do próprio yarn mostrando o caminho do binário ("$ .../playwright --version"),
      # e só a segunda é a saída real ("Version 1.58.2"). Usamos grep para isolar a linha
      # que contém "Version" antes de extrair o número.
      # DIAGNÓSTICO: imprimimos o valor capturado no log, para confirmar visualmente que
      # a versão não veio vazia (o que invalidaria a chave do cache silenciosamente).
      - name: Get Playwright Version
        id: playwright-version
        run: |
          VERSION=$(yarn playwright --version | grep -oP 'Version \K[0-9.]+')
          echo "Versão capturada: '$VERSION'"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # Cache dos browsers do Playwright entre execuções do pipeline.
      # Sem cache, toda execução baixava o Chromium do zero (~170MB), o que tornava
      # o passo de instalação sujeito a lentidão de rede e mais propenso a estourar
      # o timeout. Com o cache, a partir da 2ª execução o download é evitado.
      # restore-keys: caso a chave exata não exista (ex.: versão mudou), tenta reaproveitar
      # qualquer cache salvo para o mesmo OS, em vez de partir sempre do zero.
      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            playwright-browsers-${{ runner.os }}-

      # DIAGNÓSTICO: confirma no log se o cache foi encontrado (true) ou não (false/vazio),
      # e qual chave foi usada — assim qualquer falha de cache fica visível imediatamente,
      # em vez de só percebermos pelo tempo de execução do passo seguinte.
      - name: Debug Cache Status
        run: |
          echo "cache-hit: '${{ steps.playwright-cache.outputs.cache-hit }}'"
          echo "chave usada: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}"

      # DIAGNÓSTICO: o download do Chrome chegou a 100% em execuções anteriores e o passo
      # ainda assim estourou o timeout depois disso — um padrão consistente com falta de
      # espaço em disco no runner (o download "termina" mas a escrita final do arquivo, ou
      # a extração, falha/trava silenciosamente). Este passo mostra o espaço disponível
      # antes de instalar, para confirmar ou descartar essa hipótese.
      - name: Debug Disk Space
        run: df -h

      # Instalação das dependências do SISTEMA OPERACIONAL (libs, fontes) — não baixa o
      # navegador em si. Historicamente rápido (poucos segundos nos logs anteriores).
      - name: Install OS Dependencies for Playwright
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: yarn playwright install-deps chromium

      # Download/instalação do binário do Chromium, separado do passo anterior.
      # DIAGNÓSTICO: em 3 execuções seguidas o log mostrou a barra de progresso chegando a
      # 100% e o passo ainda assim estourando o timeout depois disso — sinal de que algo
      # acontece DEPOIS do download "visível" (extração, verificação, ou trava real de I/O).
      # DEBUG=pw:install liga os logs internos do instalador do Playwright, que normalmente
      # ficam ocultos, para revelar o que ocorre nesse intervalo.
      - name: Install Chromium Browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        env:
          DEBUG: pw:install
        run: yarn playwright install chromium


      # Execução dos testes E2E
      # BASE_URL aponta para o deployment de preview, que está conectado ao Supabase de preview.
      # Qualquer pedido criado por esses testes vai para o banco de preview, não o de produção.
      - name: Run E2E Regression Tests
        timeout-minutes: 8
        run: yarn playwright test playwright/e2e
        env:
          BASE_URL: ${{ needs.build-and-deploy.outputs.deployment-url }}

      # Relatório de Testes Automatizados
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4.3.2
        with:
          name: playwright-report
          path: playwright-report

  promote:
    name: Build & Deploy to Production
    needs: [e2e-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Realiza o checkout do código-fonte do repositório
      - name: Checkout Repository
        uses: actions/checkout@v6.0.2

      # Configura a versão do Node.js utilizada pelo projeto
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Habilita o Corepack para gerenciamento do Yarn
      - name: Enable Corepack
        run: corepack enable

      # Instala as dependências utilizando o lockfile do projeto
      - name: Install Dependencies
        run: yarn install --immutable

      # Obter as configurações do vercel para o ambiente de PRODUCTION
      # Aqui está a virada de chave: puxamos as variáveis VITE_SUPABASE_* cadastradas
      # no ambiente "Production" da Vercel, que apontam para o Supabase de produção.
      - name: Pull Vercel Config
        run: yarn vercel pull --yes --environment=production --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE

      # Gera um NOVO build, agora com as variáveis de produção embutidas no bundle.
      # Não reaproveitamos o build de preview: ele tem os valores de preview "gravados".
      - name: Build Vercel
        run: yarn vercel build --prod --token=$VERCEL_TOKEN

      # Deploy direto para produção, usando o build que acabamos de gerar
      - name: Deploy Vercel to Production
        run: yarn vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE