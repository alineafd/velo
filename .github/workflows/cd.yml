# Workflow de Integração Contínua (CI)
# Objetivo:
# Executar os testes unitários da aplicação a cada push na branch main.
# Estrutura mantida simples e preparada para expansão futura com novos jobs e etapas.

name: Continuous Deployment

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: '24'
  VERCEL_TOKEN: ${{secrets.VERCEL_TOKEN}}
  VERCEL_PROJECT_ID: ${{secrets.VERCEL_PROJECT_ID}}
  VERCEL_ORG_ID: ${{secrets.VERCEL_ORG_ID}}
  VERCEL_SCOPE: ${{secrets.VERCEL_SCOPE}}

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      # Realiza o checkout do código-fonte do repositório
      - name: Checkout Repository
        uses: actions/checkout@v6.0.2

      # Configura a versão do Node.js utilizada pelo projeto
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Habilita o Corepack para gerenciamento do Yarn
      - name: Enable Corepack
        run: corepack enable

      # Instala as dependências utilizando o lockfile do projeto
      - name: Install Dependencies
        run: yarn install --immutable

      # Executa os testes unitários com Vitest
      - name: Run Unit Tests
        run: yarn test
      
    
  build-and-deploy:
    name: Build & Deploy Vercel Preview
    needs: [unit-tests  ]
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.vercel_deploy.outputs.deployment_url }}
    
    steps:
      # Realiza o checkout do código-fonte do repositório
      - name: Checkout Repository
        uses: actions/checkout@v6.0.2

      # Configura a versão do Node.js utilizada pelo projeto
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Habilita o Corepack para gerenciamento do Yarn
      - name: Enable Corepack
        run: corepack enable

      # Instala as dependências utilizando o lockfile do projeto
      - name: Install Dependencies
        run: yarn install --immutable

      #Obter as configurações do vercel
      - name: Pull Vercel Config
        run: yarn vercel pull --yes --environment=preview --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE

      # Build para o vercel
      - name: Build Vercel
        run: yarn vercel build --token=$VERCEL_TOKEN

      # Deploy preview no vercel
      - name: Deploy Vercel
        id: vercel_deploy
        run: |
          URL=$(yarn --silent vercel deploy --prebuilt --target=preview --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE)
          echo "deployment-url=$URL" >> $GITHUB_OUTPUT

  e2e-tests:
    name: Run E2E Tests
    needs: [build-and-deploy]
    runs-on: ubuntu-latest

    steps:
      # Realiza o checkout do código-fonte do repositório
      - name: Checkout Repository
        uses: actions/checkout@v6.0.2

      # Configura a versão do Node.js utilizada pelo projeto
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Habilita o Corepack para gerenciamento do Yarn
      - name: Enable Corepack
        run: corepack enable

      # Instalação das dependências do sistema operacional apontando direto para o binário
      - name: Install Playwright Operating System Dependencies
        run: ./node_modules/.bin/playwright install-deps chromium

      # Instalação do Chromium apontando direto para o binário
      - name: Install Playwright Browsers
        run: ./node_modules/.bin/playwright install chromium

      # Execução dos testes apontando direto para o binário
      - name: Run E2E Regression Tests
        run: ./node_modules/.bin/playwright test playwright/e2e
        env:
          BASE_URL: ${{ needs.build-and-deploy.outputs.deployment-url }}
              
      # Relatório de Testes Automatizados
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4.3.2
        with:
          name: playwright-report
          path: playwright-report

  promote:
    name: Promote to Production
    needs: [e2e-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Vercel promote
        run: |
          npx vercel@latest promote ${{ needs.build-and-deploy.outputs.deployment-url }} \
            --token=$VERCEL_TOKEN \
            --scope=$VERCEL_SCOPE \
            --yes
    